<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cartel" />
<meta name="theme-color" content="#14100d" />
<title>Cartel growth tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px 200px;
    background: #14100d;
    color: #f2ede4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 720px; }
  .card {
    background: #1e1812;
    border: 1px solid #322920;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 15px;
    color: #a89d8c;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: #14100d;
    border: 1px solid #3a3025;
    border-radius: 12px;
    padding: 20px 16px;
    font-size: 22px;
    font-family: inherit;
    color: #f2ede4;
    outline: none;
    -webkit-appearance: none;
  }
  input:focus { border-color: #c8934a; }
  button {
    width: 100%;
    background: #c8934a;
    color: #14100d;
    border: none;
    border-radius: 18px;
    padding: 32px 24px;
    min-height: 88px;
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    margin-top: 16px;
    -webkit-appearance: none;
    touch-action: manipulation;
  }
  button:active { opacity: 0.85; }
  button.secondary {
    background: none;
    color: #a89d8c;
    border: 1px solid #3a3025;
    min-height: 68px;
    padding: 20px;
    font-size: 20px;
    font-weight: 600;
  }
  .error {
    font-size: 13px;
    color: #e0836a;
    margin-top: 8px;
    display: none;
  }
  .popup {
    display: none;
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 50;
    background: #b3261e;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(32px + env(safe-area-inset-top)) 24px
             calc(32px + env(safe-area-inset-bottom));
  }
  .popup.show { display: flex; }
  .popup .move {
    color: #fff;
    width: 100%;
    max-width: 560px;
  }
  .popup .move-label {
    display: block;
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
  }
  .popup .move-num {
    display: block;
    font-size: clamp(110px, 40vw, 200px);
    line-height: 0.95;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin: 12px 0 4px;
  }
  .popup .move-unit {
    display: block;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 700;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.85);
  }
  .popup button {
    background: #fff;
    color: #b3261e;
    width: 100%;
    max-width: 420px;
    margin-top: 56px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="field">
      <label for="size">Cartel size</label>
      <input type="number" id="size" inputmode="numeric" enterkeyhint="next" placeholder="e.g. 100" />
    </div>
    <div class="field">
      <label for="growth">Growth rate (%)</label>
      <input type="number" id="growth" inputmode="decimal" enterkeyhint="next" placeholder="e.g. 10" />
    </div>
    <div class="field">
      <label for="arrests">Arrests</label>
      <input type="number" id="arrests" inputmode="numeric" enterkeyhint="go" placeholder="e.g. 8" />
    </div>

    <p class="error" id="input-error">Enter cartel size, growth rate and arrests.</p>
    <button id="calc-btn">Calculate move</button>
    <button id="reset-btn" class="secondary">Reset</button>

  </div>
</div>

<div class="popup" id="result-box" role="dialog" aria-modal="true" aria-labelledby="result-text">
  <div class="move">
    <span class="move-label">Move the piece by</span>
    <span class="move-num" id="result-text">0</span>
    <span class="move-unit" id="result-unit">units</span>
  </div>
  <button id="popup-reset">Reset</button>
</div>

<script>
const sizeEl = document.getElementById('size');
const growthEl = document.getElementById('growth');
const arrestsEl = document.getElementById('arrests');
const errEl = document.getElementById('input-error');
const resultBox = document.getElementById('result-box');
const resultText = document.getElementById('result-text');
const resultUnit = document.getElementById('result-unit');

function advance(from, to) {
  from.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (to) { to.focus(); return; }
    this.blur();
    document.getElementById('calc-btn').click();
  });
}
advance(sizeEl, growthEl);
advance(growthEl, arrestsEl);
advance(arrestsEl, null);

document.getElementById('calc-btn').addEventListener('click', function () {
  const size = parseFloat(sizeEl.value);
  const growthPct = parseFloat(growthEl.value);
  const arrests = parseFloat(arrestsEl.value);

  if (isNaN(size) || isNaN(growthPct) || isNaN(arrests)) {
    errEl.style.display = 'block';
    resultBox.classList.remove('show');
    return;
  }
  errEl.style.display = 'none';

  const move = Math.round(size * (growthPct / 100) - arrests);
  const moveText = move.toLocaleString();
  resultText.textContent = moveText;
  // step the number down so long values can't run off a phone screen
  resultText.style.fontSize =
    moveText.length > 6 ? 'clamp(56px, 19vw, 104px)' :
    moveText.length > 4 ? 'clamp(78px, 27vw, 148px)' : '';
  resultUnit.textContent = Math.abs(move) === 1 ? 'unit' : 'units';
  resultBox.classList.add('show');
  document.activeElement && document.activeElement.blur();
});

function reset() {
  sizeEl.value = '';
  growthEl.value = '';
  arrestsEl.value = '';
  errEl.style.display = 'none';
  resultBox.classList.remove('show');
  sizeEl.focus();
}

document.getElementById('popup-reset').addEventListener('click', reset);

document.getElementById('reset-btn').addEventListener('click', reset);
</script>
</body>
</html>
